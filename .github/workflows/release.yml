name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.3 or 1.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_version="${REQUESTED_VERSION:-$GITHUB_REF_NAME}"
          if [[ ! "$release_version" =~ ^v?[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo 'Expected v1.3 or v1.3.1 (the v prefix is optional for manual runs).' >&2
            exit 1
          fi
          release_version="${release_version#v}"
          release_tag="v$release_version"
          existing_commit="$(git rev-parse --verify -q "refs/tags/${release_tag}^{commit}" || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$(git rev-parse HEAD)" ]]; then
            # Rebuild an existing release from its original source using this workflow.
            git checkout --detach "$existing_commit"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26 or later
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              with (app / 'Contents/Info.plist').open('rb') as source:
                  version = plistlib.load(source)['CFBundleShortVersionString']
              if 'beta' in app.name.lower() or 'rc' in app.name.lower():
                  continue
              parts = tuple(int(part) for part in version.split('.'))
              if parts[0] >= 26:
                  candidates.append((parts, app))
          if not candidates:
              raise SystemExit('Xcode 26 or later is required on the runner.')
          _, app = max(candidates)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DEVELOPER_DIR={app}/Contents/Developer\n')
          print(f'Using {app.name}')
          PY

      - name: Build universal Release app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Apply the current app name when rebuilding older tagged source too.
          plutil -replace CFBundleName -string keepinput lockinput/Info.plist
          plutil -replace CFBundleDisplayName -string keepinput lockinput/Info.plist
          xcodebuild -project lockinput.xcodeproj \
            -scheme lockinput -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            PRODUCT_NAME=keepinput \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Ad-hoc sign and package DMG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app_path='build/Build/Products/Release/keepinput.app'
          codesign --force --deep --sign - --timestamp=none "$app_path"
          codesign --verify --deep --strict "$app_path"
          architectures="$(xcrun lipo -archs "$app_path/Contents/MacOS/keepinput")"
          for architecture in arm64 x86_64; do
            case " $architectures " in
              *" $architecture "*) ;;
              *) echo "Missing architecture: $architecture" >&2; exit 1 ;;
            esac
          done
          mkdir -p dist staging
          ditto "$app_path" staging/keepinput.app
          ln -s /Applications staging/Applications
          image_name="keepinput-${RELEASE_VERSION}.dmg"
          hdiutil create -volname "keepinput ${RELEASE_VERSION}" \
            -srcfolder staging -format UDZO -ov "dist/$image_name"
          (cd dist && shasum -a 256 "$image_name" > "$image_name.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image_path="dist/keepinput-${RELEASE_VERSION}.dmg"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$image_path" "$image_path.sha256" --clobber
            gh release edit "$RELEASE_TAG" --title "keepinput $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "$image_path" "$image_path.sha256" \
              --target "$GITHUB_SHA" --title "keepinput $RELEASE_TAG" --generate-notes
          fi
